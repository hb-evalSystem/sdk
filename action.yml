name: 'HB-Eval reliability gate'
description: >-
  Reliability as a merge gate. Compares an agent's measured reliability against a baseline or an
  SLO policy and fails the job only when you tell it to enforce. Warn mode is the default.
author: 'HB-Eval'
branding:
  icon: shield
  color: blue

inputs:
  reference-baseline:
    description: 'Reference baseline JSON (authoritative decision path). Use with candidate-baseline.'
    required: false
    default: ''
  candidate-baseline:
    description: 'Candidate baseline JSON (authoritative decision path). Use with reference-baseline.'
    required: false
    default: ''
  slo-policy:
    description: 'SLO policy JSON the decision is evaluated against.'
    required: false
    default: ''
  agent:
    description: "Agent callable as 'module.path:attribute' (legacy path; needs HBEVAL_* secrets)."
    required: false
    default: ''
  task:
    description: "Task JSON with 'system' and 'question' (legacy path)."
    required: false
    default: '.hbeval/task.json'
  baseline:
    description: 'Stored baseline to compare against (legacy path).'
    required: false
    default: ''
  update-baseline:
    description: 'Write the new baseline here, only when the run passes (legacy path).'
    required: false
    default: ''
  report:
    description: 'Write the full JSON report here.'
    required: false
    default: ''
  scenarios:
    description: 'Number of battery scenarios. Empty = the CLI default.'
    required: false
    default: ''
  seed:
    description: 'Scenario-selection seed. Empty = the CLI default.'
    required: false
    default: ''
  max-regression:
    description: 'Tolerated drop before a baseline comparison counts. Empty = the CLI default.'
    required: false
    default: ''
  enforce:
    description: "'true' makes a failed gate fail the job. Start with 'false'."
    required: false
    default: 'false'
  python-version:
    description: 'Python used to run the gate (3.9 or newer).'
    required: false
    default: '3.12'
  working-directory:
    description: 'Directory to run in (where your agent module and files live).'
    required: false
    default: '.'

outputs:
  exit-code:
    description: '0 pass or warn, 1 gate failed, 2 usage/config error, 3 inconclusive, 4 recertification required.'
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # Installed from THIS action's own checkout, so the gate always runs the SDK
    # version that the tag you pinned (uses: ...@v2.13.0) actually contains.
    - name: Install hb-eval-sdk from the action checkout
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --quiet "$ACTION_PATH"

    - name: Run the gate
      id: gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Inputs travel through the environment, never interpolated into the script:
      # a pull request must not be able to inject shell through an input value.
      env:
        IN_REFERENCE: ${{ inputs.reference-baseline }}
        IN_CANDIDATE: ${{ inputs.candidate-baseline }}
        IN_POLICY: ${{ inputs.slo-policy }}
        IN_AGENT: ${{ inputs.agent }}
        IN_TASK: ${{ inputs.task }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_UPDATE: ${{ inputs.update-baseline }}
        IN_REPORT: ${{ inputs.report }}
        IN_SCENARIOS: ${{ inputs.scenarios }}
        IN_SEED: ${{ inputs.seed }}
        IN_MAXREG: ${{ inputs.max-regression }}
        IN_ENFORCE: ${{ inputs.enforce }}
      run: |
        args=(gate)
        [ -n "$IN_REFERENCE" ] && args+=(--reference-baseline "$IN_REFERENCE")
        [ -n "$IN_CANDIDATE" ] && args+=(--candidate-baseline "$IN_CANDIDATE")
        [ -n "$IN_POLICY" ]    && args+=(--slo-policy "$IN_POLICY")
        [ -n "$IN_AGENT" ]     && args+=(--agent "$IN_AGENT")
        # The task file only matters on the legacy path; do not demand it on the other.
        if [ -n "$IN_AGENT" ] && [ -n "$IN_TASK" ]; then args+=(--task "$IN_TASK"); fi
        [ -n "$IN_BASELINE" ]  && args+=(--baseline "$IN_BASELINE")
        [ -n "$IN_UPDATE" ]    && args+=(--update-baseline "$IN_UPDATE")
        [ -n "$IN_REPORT" ]    && args+=(--report "$IN_REPORT")
        [ -n "$IN_SCENARIOS" ] && args+=(--scenarios "$IN_SCENARIOS")
        [ -n "$IN_SEED" ]      && args+=(--seed "$IN_SEED")
        [ -n "$IN_MAXREG" ]    && args+=(--max-regression "$IN_MAXREG")
        [ "$IN_ENFORCE" = "true" ] && args+=(--enforce)
        set +e
        hb-eval "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
